site_name: Agent Design Patterns
site_description: Patterns and anti-patterns for building reliable AI agents.
copyright: "Copyright © Microsoft 2026"

theme:
  name: material
  icon:
    logo: fontawesome/solid/hexagon-nodes
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - meta
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

plugins:
  - search
  - tags

hooks:
  - hooks/catalog.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: javascripts/mermaid.mjs
    type: module

nav:
  - Introduction: index.md
  - Tags: tags.md
  - Contributing: contributing.md