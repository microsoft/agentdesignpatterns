site_name: Agent Design Patterns
site_description: Patterns and anti-patterns for building reliable AI agents.
copyright: "Copyright © Microsoft 2026"

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - meta
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

plugins:
  - search
  - tags

hooks:
  - hooks/catalog.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: javascripts/mermaid.mjs
    type: module

nav:
  - Introduction: index.md
  - Patterns:
      - Overview: patterns/index.md
      - Bounded Tool Calls: patterns/bounded-tool-calls.md
  - Anti-Patterns:
      - Overview: anti-patterns/index.md
      - Tool Pass-Through Agent: anti-patterns/tool-pass-through-agent.md
      - Unbounded Retries: anti-patterns/unbounded-retries.md
  - Tags: tags.md
  - Contributing: contributing.md